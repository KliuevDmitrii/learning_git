name: RateBot

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 10 * * *'
    - cron: '30 12 * * *'
  push:
    paths:
      - 'project/**'
      - '.github/workflows/ratebot.yml'
  pull_request:
    paths:
      - 'project/**'
      - '.github/workflows/ratebot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r project/requirements.txt
      - run: python -m unittest discover -s project -p 'test_*.py' -v

  # Scheduled and manual runs perform one check, then save the notified rate.
  run-once:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: ratebot-notifications
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r project/requirements.txt
      - name: Check rate once
        env:
          APILAYER_API_KEY: ${{ secrets.APILAYER_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python project/exchange_rate.py --once
      - name: Save last notified rate
        run: |
          git config user.name "RateBot"
          git config user.email "ratebot@example.com"
          git add project/last_rate.json
          if ! git diff --cached --quiet; then
            git commit -m "update last rate"
            git push
          fi
